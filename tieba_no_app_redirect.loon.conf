# Loon 配置片段（贴吧防跳转）
# 把下面两段分别并入你的 Loon 配置 / .plugin 的对应区块即可。

[MITM]
hostname = tieba.baidu.com

[Script]
# 方式A：脚本托管在 CDN（把你自己的地址填到 script-path）
http-request ^https?:\/\/tieba\.baidu\.com\/(f|mo\/q\/activityDiversion\/download|h5activity\/download)\? script-path=https://你的CDN/tieba_no_app_redirect.loon.js, requires-body=false, tag=贴吧防跳转, enable=true

# 方式B：用 Loon App 内“新建脚本”粘贴 tieba_no_app_redirect.loon.js 后，
#        在 [Script] 里引用本地脚本（路径以 Loon 实际存储为准）：
# http-request ^https?:\/\/tieba\.baidu\.com\/(f|mo\/q\/activityDiversion\/download|h5activity\/download)\? script-path=tieba_no_app_redirect.loon.js, requires-body=false, tag=贴吧防跳转, enable=true
